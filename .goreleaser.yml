# goreleaser configuration. Triggered by .github/workflows/release.yml on
# every "v*" tag push. To test locally (optional):
#   goreleaser release --snapshot --clean
# Snapshots produce binaries in ./dist/ without touching GitHub.

version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: xql
    main: ./cmd/xql
    binary: xql
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}

archives:
  - id: xql
    name_template: "xql_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: ["zip"]
    files:
      - LICENSE
      - README.md

nfpms:
  - id: xql
    package_name: xql
    file_name_template: "{{ .ConventionalFileName }}"
    maintainer: David M. Anderson <david.anderson@excelano.com>
    description: |
      XQL — Excelano Query Language CLI.
      One binary, one SQL dialect, three backends: CSV files, SharePoint
      Lists over Microsoft Graph, and xinglists (read-only). The same
      SELECT runs against any of them; CSV and SharePoint also take
      INSERT, UPDATE, and DELETE, which preview the affected rows and
      commit only on confirmation.
      Part of the Excelano tabular family — four small tools split by
      what changes: xray observes and changes nothing, xled edits cell
      values, xshape changes the grid's shape, xql queries the row set.
    homepage: https://github.com/excelano/xql
    license: MIT
    formats:
      - deb
    section: database
    priority: optional
    bindir: /usr/bin
    contents:
      - src: ./LICENSE
        dst: /usr/share/doc/xql/copyright
      - src: ./README.md
        dst: /usr/share/doc/xql/README.md

checksum:
  name_template: "checksums.txt"

release:
  draft: false
  prerelease: auto
  # Ship install.sh alongside the platform tarballs so users can pin to a
  # specific release URL instead of relying on the rolling main branch.
  extra_files:
    - glob: install.sh
    - glob: uninstall.sh

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "Merge pull request"

brews:
  - name: xql
    repository:
      owner: excelano
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: "https://excelano.com/xql/"
    description: "Run real SQL against SharePoint Lists and CSV files"
    license: "MIT"
    install: |
      bin.install "xql"
    test: |
      system "#{bin}/xql", "--version"
